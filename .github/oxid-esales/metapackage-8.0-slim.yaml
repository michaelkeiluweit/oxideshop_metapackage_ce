install:
  git:
    sdk_ref: b-8.0.x
  add_services: 'selenium-chrome-126'
  method: 'script'
  script: './.github/oxid-esales/install.sh'
  copy_script_targets: |
    vendor/oxid-esales/oxideshop-ce/tests/scripts
    vendor/oxid-esales/oxideshop-composer-plugin/tests/scripts
    vendor/oxid-esales/oxideshop-demodata-installer/tests/scripts
    vendor/oxid-esales/oxideshop-doctrine-migration-wrapper/tests/scripts
    vendor/oxid-esales/twig-component/tests/scripts
    vendor/oxid-esales/oxideshop-unified-namespace-generator/tests/scripts
  container:
    options: '-e ESHOP_BOOTSTRAP_PATH=vendor/oxid-esales/oxideshop-ce/source/bootstrap.php'
  composer:
    root_url: 'https://raw.githubusercontent.com/{{ .Github.Repository }}/b-8.0-update-workflows-OXDEV-9158/composer.json'
    transform: |
      {
          "config": {
              "github-protocols": ["https"],
              "allow-plugins":{
                "oxid-esales/oxideshop-composer-plugin":true,
                "oxid-esales/oxideshop-unified-namespace-generator":true
              }
          },
          "minimum-stability": "dev",
          "preferred-install": {
            "oxid-esales/*": "source",
            "oxid-professional-services/*": "source",
            "ddoe/*": "source",
            "makaira/*": "source"
          },
          "require":{
            "composer/composer": "^2.8"
          },
          "require-dev":{
              "oxid-esales/codeception-modules":"{{ .Data.global.composer.dev_ref }}",
              "oxid-esales/codeception-page-objects":"{{ .Data.global.composer.dev_ref }}",
              "oxid-esales/developer-tools":"{{ .Data.global.composer.dev_ref }}",
              "oxid-esales/oxideshop-ide-helper":"{{ .Data.global.composer.dev_ref }}",
              "codeception/codeception":"^5.0",
              "codeception/module-asserts":"^3.0",
              "codeception/module-db":"^3.0",
              "codeception/module-filesystem":"^3.0",
              "codeception/module-webdriver":"^4.0",
              "composer/composer":"^2.0",
              "incenteev/composer-parameter-handler":"^v2.1.4",
              "mikey179/vfsstream":"~1.6.8",
              "phpspec/prophecy-phpunit":"^v2.0.1",
              "phpunit/phpunit":"^11.4",
              "squizlabs/php_codesniffer":"^3.5.4",
              "symfony/browser-kit": "^6.4",
              "symfony/http-client": "^6.4"
          },
          "autoload-dev":{
              "psr-4":{
                "OxidEsales\\EshopCommunity\\Tests\\":"./vendor/oxid-esales/oxideshop-ce/tests",
                "OxidEsales\\ComposerPlugin\\Tests\\": "vendor/oxid-esales/oxideshop-composer-plugin/tests/",
                "OxidEsales\\UnifiedNameSpaceGenerator\\Tests\\": "./vendor/oxid-esales/oxideshop-unified-namespace-generator/tests",
                "OxidEsales\\DemoDataInstaller\\Tests\\": "./vendor/oxid-esales/oxideshop-demodata-installer/tests/",
                "OxidEsales\\DoctrineMigrationWrapper\\Tests\\": "./vendor/oxid-esales/oxideshop-doctrine-migration-wrapper/tests",
                "OxidEsales\\Twig\\Tests\\": "./vendor/oxid-esales/twig-component/tests"
              }
          },
          "bin":[
              "bin/oe-console"
          ],
          "config":{
              "github-protocols": ["https"],
              "allow-plugins":{
                "oxid-esales/oxideshop-composer-plugin":true,
                "oxid-esales/oxideshop-unified-namespace-generator":true
              }
          }
      }
  activate_modules: ''

runscript:
  matrix:
    script: |
      [
        "shop:~/compilation_integration.sh"
      ]
  container:
    # {{ $selenium_options := "-e SELENIUM_SERVER_HOST=selenium -e BROWSER_NAME=chrome -e TEST_SUITE=/var/www/vendor/oxid-esales/oxideshop-ce/tests" }}
    # {{ $module_ids := "-e MODULE_IDS=eyeable_assist,makaira_oxid-connect-essential,oxps_usercentrics,oegdproptin,ddoemedialibrary,ddoewysiwyg" }}
    # {{ $integration_options := "-e INTEGRATION_OPTIONS=--exclude-group=exclude_from_compilation,exclude-from-compilation" }}
    options: '-e XDEBUG_MODE=coverage -e THEME_ID=apex {{ $module_ids }} {{ $selenium_options }} {{ $integration_options }} '
  composer:
    early: skip
  workdir: ''
  shop:
    path: 'vendor/oxid-esales/oxideshop-ce'
    workdir: 'vendor/oxid-esales/oxideshop-ce'
    custom_script: |
      cat >source/vendor/oxid-esales/oxideshop-ce/tests/scripts/compilation_codeception_shard1.sh <<EOF
      #!/bin/bash
      /var/www/vendor/bin/codecept build -c /var/www/vendor/oxid-esales/oxideshop-ce/tests/codeception.yml
      /var/www/vendor/bin/codecept run Acceptance --bootstrap=/var/www/source/bootstrap.php  -c /var/www/vendor/oxid-esales/oxideshop-ce/tests/codeception.yml -x exclude_from_compilation --shard 1/4
      EOF
      chmod a+x source/vendor/oxid-esales/oxideshop-ce/tests/scripts/compilation_codeception_shard1.sh
      cat >source/vendor/oxid-esales/oxideshop-ce/tests/scripts/compilation_codeception_shard2.sh <<EOF
      #!/bin/bash
      /var/www/vendor/bin/codecept build -c /var/www/vendor/oxid-esales/oxideshop-ce/tests/codeception.yml
      /var/www/vendor/bin/codecept run Acceptance --bootstrap=/var/www/source/bootstrap.php  -c /var/www/vendor/oxid-esales/oxideshop-ce/tests/codeception.yml -x exclude_from_compilation --shard 2/4
      EOF
      chmod a+x source/vendor/oxid-esales/oxideshop-ce/tests/scripts/compilation_codeception_shard2.sh
      cat >source/vendor/oxid-esales/oxideshop-ce/tests/scripts/compilation_codeception_shard3.sh <<EOF
      #!/bin/bash
      /var/www/vendor/bin/codecept build -c /var/www/vendor/oxid-esales/oxideshop-ce/tests/codeception.yml
      /var/www/vendor/bin/codecept run Acceptance --bootstrap=/var/www/source/bootstrap.php  -c /var/www/vendor/oxid-esales/oxideshop-ce/tests/codeception.yml -x exclude_from_compilation --shard 3/4
      EOF
      chmod a+x source/vendor/oxid-esales/oxideshop-ce/tests/scripts/compilation_codeception_shard3.sh
      cat >source/vendor/oxid-esales/oxideshop-ce/tests/scripts/compilation_codeception_shard4.sh <<EOF
      #!/bin/bash
      /var/www/vendor/bin/codecept build -c /var/www/vendor/oxid-esales/oxideshop-ce/tests/codeception.yml
      /var/www/vendor/bin/codecept run Acceptance --bootstrap=/var/www/source/bootstrap.php  -c /var/www/vendor/oxid-esales/oxideshop-ce/tests/codeception.yml -x exclude_from_compilation --shard 4/4
      EOF
      chmod a+x source/vendor/oxid-esales/oxideshop-ce/tests/scripts/compilation_codeception_shard4.sh
      cat >source/vendor/oxid-esales/oxideshop-ce/tests/scripts/compilation_integration.sh <<EOF
      #!/bin/bash
      /var/www/vendor/bin/phpunit -c /var/www/vendor/oxid-esales/oxideshop-ce/phpunit.xml --testsuite=Integration --exclude-group exclude_from_compilation,exclude-from-compilation
      EOF
      chmod a+x source/vendor/oxid-esales/oxideshop-ce/tests/scripts/compilation_integration.sh
  gdpr:
    path: 'vendor/oxid-esales/gdpr-optin-module'
  usercentrics:
    path: 'vendor/oxid-professional-services/usercentrics'
  makaira:
    path: 'vendor/makaira/oxid-connect-essential'
  ddoe_wysiwyg:
    path: 'vendor/ddoe/wysiwyg-editor-module'
  medialibrary:
    path: 'vendor/oxid-esales/media-library-module'
  eyeable:
    path: 'vendor/eyeable/eye-able-oxid'

sonarcloud:
  matrix:
    testplan: 'skip'

finish:
  slack_title: 'Metapackage CE (8.0 slim) on {{ .Github.Repository }} by {{ .Github.Actor }}'